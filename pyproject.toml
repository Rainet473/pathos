[build-system]
requires = ["setuptools>=80,<82"]
build-backend = "setuptools.build_meta"

[project]
name = "interruptible-voice-presentation"
version = "0.1.0"
description = "An interruptible, stateful AI voice presentation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.2",
  "livekit==1.1.8",
  "livekit-agents==1.5.17",
  "livekit-api==1.2.0",
  "livekit-plugins-google==1.5.17",
  "livekit-plugins-openai==1.5.17",
  "pydantic==2.13.4",
  "uvicorn[standard]==0.51.0",
]

[project.optional-dependencies]
test = [
  "httpx2==2.9.0",
  "pytest==9.1.1",
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["backend/src"]
markers = [
    "offline: deterministic tests that require no network or provider credentials",
    "integration: tests that cross a process, transport, or service boundary",
    "live: opt-in tests that use external services or model providers",
    "observation: repeatable human-evaluated scenarios with retained evidence",
]
