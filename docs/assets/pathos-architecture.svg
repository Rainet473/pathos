<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780" role="img" aria-labelledby="title description">
  <title id="title">Pathos interruptible voice presentation architecture</title>
  <desc id="description">A listener uses a slide-first browser connected through LiveKit to an application control plane. The application owns presentation state, bounded reasoning, evidence validation, and playout commitment while a replaceable voice model port constructs the selected speech pipeline.</desc>
  <defs>
    <style>
      .role-icon { font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
    </style>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#141821"/>
      <stop offset="1" stop-color="#0c0f14"/>
    </linearGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f08a4b"/>
      <stop offset="1" stop-color="#f3c56a"/>
    </linearGradient>
    <linearGradient id="control" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#222936"/>
      <stop offset="1" stop-color="#1a202a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.34"/>
    </filter>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f08a4b"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#65bfe8"/>
    </marker>
  </defs>

  <rect width="1440" height="780" rx="28" fill="url(#background)"/>
  <circle cx="1260" cy="72" r="230" fill="#65bfe8" opacity="0.055"/>
  <circle cx="90" cy="720" r="280" fill="#f08a4b" opacity="0.06"/>

  <g transform="translate(72 58)">
    <circle cx="30" cy="30" r="30" fill="url(#brand)"/>
    <path d="M21 45V15h12.5c9.5 0 15.5 5.2 15.5 13.2 0 8.2-6 13.8-15.5 13.8H29v3zM29 34h4.5c5.1 0 7.7-1.9 7.7-5.8 0-3.7-2.6-5.4-7.7-5.4H29z" fill="#11151b"/>
    <text x="82" y="35" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="0.5">PATHOS</text>
    <text x="82" y="59" fill="#9098a6" font-family="Inter, Arial, sans-serif" font-size="15">Application-controlled, interruptible voice presentations</text>
  </g>

  <text x="72" y="170" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="32" font-weight="650">The model speaks. The application runs the presentation.</text>
  <text x="72" y="204" fill="#aeb5c1" font-family="Inter, Arial, sans-serif" font-size="17">Every interruption, search, citation, slide change, and playout commit crosses a validated application boundary.</text>

  <g filter="url(#shadow)">
    <rect x="72" y="282" width="244" height="236" rx="22" fill="#1a1f28" stroke="#343b48"/>
    <rect x="94" y="306" width="200" height="112" rx="12" fill="#0c1118" stroke="#4a5362"/>
    <rect x="110" y="322" width="168" height="80" rx="6" fill="#182330"/>
    <path d="M124 382l34-32 30 22 34-31 42 41" fill="none" stroke="#65bfe8" stroke-width="4"/>
    <circle cx="246" cy="340" r="7" fill="#f3c56a"/>
    <text class="role-icon" x="94" y="454" font-size="25">🎧</text>
    <text x="128" y="452" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="650">Listener + browser</text>
    <text x="94" y="480" fill="#aeb5c1" font-family="Inter, Arial, sans-serif" font-size="14">microphone · slide deck</text>
    <text x="94" y="502" fill="#aeb5c1" font-family="Inter, Arial, sans-serif" font-size="14">transcript · controls</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="382" y="314" width="212" height="172" rx="22" fill="#1a1f28" stroke="#343b48"/>
    <text class="role-icon" x="406" y="365" font-size="27">🌐</text>
    <text x="442" y="362" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="19" font-weight="650">LiveKit</text>
    <text x="406" y="407" fill="#aeb5c1" font-family="Inter, Arial, sans-serif" font-size="14">WebRTC room</text>
    <text x="406" y="432" fill="#aeb5c1" font-family="Inter, Arial, sans-serif" font-size="14">audio + data events</text>
    <text x="406" y="457" fill="#aeb5c1" font-family="Inter, Arial, sans-serif" font-size="14">conversation bridge</text>
  </g>

  <path d="M316 400H382" fill="none" stroke="#65bfe8" stroke-width="3" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="333" y="382" fill="#7fa3b7" font-family="Inter, Arial, sans-serif" font-size="12">stream</text>

  <g filter="url(#shadow)">
    <rect x="662" y="246" width="436" height="310" rx="26" fill="url(#control)" stroke="#f08a4b" stroke-width="1.5"/>
    <text class="role-icon" x="694" y="291" font-size="27">🧠</text>
    <text x="732" y="288" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="23" font-weight="700">Application control plane</text>
    <text x="694" y="315" fill="#f3b16f" font-family="Inter, Arial, sans-serif" font-size="13" letter-spacing="0.8">AUTHORITATIVE STATE + POLICY</text>

    <rect x="694" y="342" width="174" height="78" rx="13" fill="#171c24" stroke="#3a4351"/>
    <text x="712" y="373" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">Presentation state</text>
    <text x="712" y="398" fill="#9fa8b5" font-family="Inter, Arial, sans-serif" font-size="12">cursor · visible slide · turns</text>

    <rect x="888" y="342" width="178" height="78" rx="13" fill="#171c24" stroke="#3a4351"/>
    <text x="906" y="373" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">Bounded planner</text>
    <text x="906" y="398" fill="#9fa8b5" font-family="Inter, Arial, sans-serif" font-size="12">direct · search · clarify</text>

    <rect x="694" y="438" width="174" height="78" rx="13" fill="#171c24" stroke="#3a4351"/>
    <text x="712" y="469" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">Evidence ledger</text>
    <text x="712" y="494" fill="#9fa8b5" font-family="Inter, Arial, sans-serif" font-size="12">turn + material provenance</text>

    <rect x="888" y="438" width="178" height="78" rx="13" fill="#171c24" stroke="#3a4351"/>
    <text x="906" y="469" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="650">Playout validator</text>
    <text x="906" y="494" fill="#9fa8b5" font-family="Inter, Arial, sans-serif" font-size="12">commit exactly once</text>
  </g>

  <path d="M594 400H662" fill="none" stroke="#f08a4b" stroke-width="3" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
  <text x="603" y="382" fill="#d59a66" font-family="Inter, Arial, sans-serif" font-size="12">events</text>

  <g filter="url(#shadow)">
    <rect x="1166" y="280" width="202" height="240" rx="22" fill="#1a1f28" stroke="#343b48"/>
    <text class="role-icon" x="1192" y="321" font-size="24">🤖</text>
    <text class="role-icon" x="1219" y="321" font-size="22">🎙️</text>
    <text x="1246" y="318" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="15" font-weight="700">Voice model port</text>
    <text x="1192" y="346" fill="#9fa8b5" font-family="Inter, Arial, sans-serif" font-size="12">identity + build_session()</text>
    <rect x="1192" y="370" width="150" height="35" rx="8" fill="#202a36"/>
    <text x="1205" y="392" fill="#c8d3df" font-family="Inter, Arial, sans-serif" font-size="12">LiveKit inference pipeline</text>
    <rect x="1192" y="416" width="150" height="35" rx="8" fill="#202a36"/>
    <text x="1205" y="438" fill="#c8d3df" font-family="Inter, Arial, sans-serif" font-size="12">Gemini Live adapter</text>
    <rect x="1192" y="462" width="150" height="35" rx="8" fill="#202a36"/>
    <text x="1205" y="484" fill="#c8d3df" font-family="Inter, Arial, sans-serif" font-size="12">OpenAI Realtime adapter</text>
  </g>

  <path d="M1098 400H1166" fill="none" stroke="#f08a4b" stroke-width="3" marker-start="url(#arrow-orange)" marker-end="url(#arrow-orange)"/>
  <text x="1107" y="382" fill="#d59a66" font-family="Inter, Arial, sans-serif" font-size="12">directives</text>

  <g filter="url(#shadow)">
    <rect x="662" y="618" width="436" height="92" rx="19" fill="#171c24" stroke="#343b48"/>
    <text class="role-icon" x="690" y="655" font-size="25">📚</text>
    <text x="726" y="650" fill="#f5f1e8" font-family="Inter, Arial, sans-serif" font-size="17" font-weight="650">Portable presentation package</text>
    <text x="690" y="678" fill="#9fa8b5" font-family="Inter, Arial, sans-serif" font-size="13">validated slide IDs · narration beats · deep dives · renders · authored terminology</text>
  </g>
  <path d="M880 618V556" fill="none" stroke="#65bfe8" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <text x="72" y="718" fill="#87909e" font-family="Inter, Arial, sans-serif" font-size="13">Quiet until Start · interruption preserves the active beat · generated prose never controls navigation</text>
</svg>
